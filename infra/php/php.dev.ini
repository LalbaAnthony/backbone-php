; Dev profile — baked into the app-dev image (Dockerfile target "dev").
default_charset = UTF-8
date.timezone = Europe/Paris
session.gc_maxlifetime = 10000
session.cache_expire = 180
upload_max_filesize = 20M
post_max_size = 22M
memory_limit = 256M
max_execution_time = 120
expose_php=Off ; don't leak version in HTTP headers
short_open_tag=Off
file_uploads=On
max_input_vars=3000 ; default 1000 — breaks large forms/arrays
max_input_time=120

; Errors: displayed in the page and logged to Apache stderr (docker compose logs app-dev)
display_errors=On
display_startup_errors=On
error_reporting=E_ALL
log_errors=On
zend.assertions=1

opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=4000
opcache.validate_timestamps=1
opcache.revalidate_freq=0 ; files synced by docker watch are picked up on the next request
