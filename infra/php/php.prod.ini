; Prod profile — baked into the app-prod image (Dockerfile target "prod").
default_charset = UTF-8
date.timezone = Europe/Paris
session.gc_maxlifetime = 10000
session.cache_expire = 180
upload_max_filesize = 20M
post_max_size = 22M
memory_limit = 256M
max_execution_time = 120
expose_php=Off ; don't leak version in HTTP headers
short_open_tag=Off
file_uploads=On
max_input_vars=3000 ; default 1000 — breaks large forms/arrays
max_input_time=120

; Errors: never displayed (PHP's built-in default is display_errors=1), logged to Apache stderr (docker compose logs app-prod)
display_errors=Off
display_startup_errors=Off
error_reporting=E_ALL & ~E_DEPRECATED
log_errors=On
zend.assertions=-1 ; assert() compiled out, startup-only setting

opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=4000
; Code is immutable in the image, but some legacy libs write PHP cache files at runtime (e.g. mpdf_old font data):
; timestamps stay validated, at most once per minute per file.
opcache.validate_timestamps=1
opcache.revalidate_freq=60
