# Shared app definition. app-dev (profile dev) and app-prod (profile prod) differ only by
# build target (→ php.dev.ini / php.prod.ini), APP_ENV, port bind address and docker watch.
# YAML merge (<<) is shallow: nested maps (build, environment) are merged explicitly in each service.
# Enable exactly one of the two profiles: both bind APP_PORT.
# Prod publishes on 127.0.0.1 only: the site is reached through a reverse proxy on the host,
# pma and db through an SSH tunnel.
x-app-build: &app-build
  context: .
  args:
    APP_PHP_VERSION: ${APP_PHP_VERSION}
    TZ: Europe/Paris

x-app-env: &app-env
  DOCKERIZED: true
  DB_HOST: ${DB_HOST:-db}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASS: ${DB_PASSWORD}
  MAIL_RELAY_HOST: ${MAIL_RELAY_HOST:-mailpit}
  MAIL_RELAY_PORT: ${MAIL_RELAY_PORT:-1025}
  MAIL_DOMAIN: ${MAIL_DOMAIN:-}
  MAIL_DEBUG_EMAIL: ${MAIL_DEBUG_EMAIL:-}
  SMTP_ON: ${SMTP_ON:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-25}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

x-app: &app
  depends_on:
    db:
      condition: service_healthy
  networks:
    - common_network
  deploy:
    resources:
      limits:
        cpus: "${APP_CPU_LIMIT:-1}"
        memory: ${APP_MEMORY_LIMIT:-1536m}
      reservations:
        cpus: "${APP_CPU_RESERVATION:-0.25}"
        memory: ${APP_MEMORY_RESERVATION:-512m}
  restart: unless-stopped

# Shared phpMyAdmin definition. pma-dev: all interfaces + auto-login. pma-prod: 127.0.0.1 + login form.
x-pma-env: &pma-env
  DOCKERIZED: true
  TZ: Europe/Paris
  PMA_HOST: db
  APACHE_SERVER_NAME: localhost

x-pma: &pma
  image: phpmyadmin:5.2
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost/"]
    interval: 10s
    timeout: 5s
    start_period: 15s
    retries: 3
  depends_on:
    db:
      condition: service_healthy
  networks:
    - common_network
  deploy:
    resources:
      limits:
        cpus: "${PMA_CPU_LIMIT:-0.25}"
        memory: ${PMA_MEMORY_LIMIT:-256m}
      reservations:
        cpus: "${PMA_CPU_RESERVATION:-0.1}"
        memory: ${PMA_MEMORY_RESERVATION:-64m}
  restart: unless-stopped

services:
  app-dev:
    <<: *app
    profiles: ["dev"]
    ports:
      - "${APP_PORT:-80}:80"
    build:
      <<: *app-build
      target: dev
    environment:
      <<: *app-env
      APP_ENV: dev
    develop:
      watch:
        - action: sync
          path: .
          target: /var/www/html
          ignore:
            - infra/
            - .git/

  app-prod:
    <<: *app
    profiles: ["prod"]
    ports:
      - "127.0.0.1:${APP_PORT:-80}:80"
    build:
      <<: *app-build
      target: prod
    environment:
      <<: *app-env
      APP_ENV: prod

  db:
    image: mysql:8.0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      DOCKERIZED: true
      TZ: Europe/Paris
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # Shared by both profiles, loopback only (host DB client / SSH tunnel). DB_PORT is the host side:
    # containers always reach db:3306.
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - common_network
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-0.75}"
          memory: ${DB_MEMORY_LIMIT:-1536m}
        reservations:
          cpus: "${DB_CPU_RESERVATION:-0.25}"
          memory: ${DB_MEMORY_RESERVATION:-512m}
    restart: unless-stopped

  pma-dev:
    <<: *pma
    profiles: ["dev"]
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      <<: *pma-env
      # Auto-login: dev only
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}

  pma-prod:
    <<: *pma
    profiles: ["prod"]
    # Loopback only, reach it through an SSH tunnel. No PMA_USER/PMA_PASSWORD → login form.
    ports:
      - "127.0.0.1:${PMA_PORT:-8080}:80"
    environment:
      <<: *pma-env

  mailpit:
    image: axllent/mailpit:v1.30
    profiles: ["dev"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      DOCKERIZED: true
      TZ: Europe/Paris
    networks:
      - common_network
    deploy:
      resources:
        limits:
          cpus: "${MAILPIT_CPU_LIMIT:-0.25}"
          memory: ${MAILPIT_MEMORY_LIMIT:-256m}
        reservations:
          cpus: "${MAILPIT_CPU_RESERVATION:-0.1}"
          memory: ${MAILPIT_MEMORY_RESERVATION:-64m}
    restart: unless-stopped

volumes:
  db_data:

networks:
  common_network:
    driver: bridge
